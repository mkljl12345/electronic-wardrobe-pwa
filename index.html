        const enhanceTravelDestinations=()=>{const page=document.querySelector('.travel-detail-page.mobile-active');const days=page?[...page.querySelectorAll('.travel-day')]:[];if(!page||!days.length)return false;page.querySelector('.travel-timeline')?.classList.remove('travel-route-map');page.querySelectorAll('.route-stop-card,.travel-route-line,.route-map-note').forEach(node=>node.remove());const project=activeTravelContext(page),saved=getTravelDestinations();let changed=false;days.forEach(day=>{if(day.querySelector('.travel-destination-field'))return;const date=day.querySelector('.travel-date b')?.textContent.trim();if(!date)return;const field=document.createElement('label');field.className='travel-destination-field';const input=document.createElement('input');input.type='text';input.placeholder='输入当天目的地';input.value=saved[project.id]?.[date]?.name||'';input.setAttribute('aria-label',`${date}目的地`);const status=document.createElement('span');status.textContent=saved[project.id]?.[date]?.lat?'已定位':'地点';input.addEventListener('change',()=>{const name=input.value.trim();const all=getTravelDestinations();if(!name){if(all[project.id])delete all[project.id][date];saveTravelDestinations(all);status.textContent='地点';return}all[project.id]={...(all[project.id]||{}),[date]:{name}};saveTravelDestinations(all);locateTravelDestination(project.id,date,name,status)});field.append(input,status);day.querySelector('.travel-day-look')?.before(field);changed=true});return changed};

        const renderTravelMap=async()=>{const canvas=document.querySelector('.travel-map-canvas');if(!canvas)return;canvas.innerHTML='';try{const L=await loadLeaflet();window.__zhijianTravelMap?.remove();const map=L.map(canvas,{zoomControl:true});window.__zhijianTravelMap=map;L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);let projects=[];try{projects=JSON.parse(localStorage.getItem('zhijian-travel-projects')||'[]')}catch{}const projectNames=Object.fromEntries(projects.map(project=>[project.id,project.name]));const saved=getTravelDestinations(),points=[];Object.entries(saved).forEach(([projectId,dates])=>Object.entries(dates||{}).forEach(([date,item])=>{if(Number.isFinite(item.lat)&&Number.isFinite(item.lon))points.push({projectId,date,...item})}));points.sort((a,b)=>`${a.projectId}-${a.date}`.localeCompare(`${b.projectId}-${b.date}`));points.forEach((point,index)=>L.circleMarker([point.lat,point.lon],{radius:8,color:'#a85e48',weight:2,fillColor:'#f3f0e9',fillOpacity:1}).addTo(map).bindPopup(`<b>${point.name}</b><br>${projectNames[point.projectId]||'旅行'} · ${point.date}<br>第 ${index+1} 站`));if(points.length>1)L.polyline(points.map(point=>[point.lat,point.lon]),{color:'#26372e',weight:2,dashArray:'6 6',opacity:.7}).addTo(map);if(points.length)map.fitBounds(points.map(point=>[point.lat,point.lon]),{padding:[34,34],maxZoom:13});else{map.setView([35.5,104],4);const empty=document.createElement('div');empty.className='map-empty';empty.textContent='请先进入旅行项目，在每天的穿搭卡片上方填写目的地。';canvas.appendChild(empty)}setTimeout(()=>map.invalidateSize(),80)}catch{canvas.innerHTML='<div class="map-empty">地图加载失败，请检查网络后重新进入地图页面。</div>'}};
        const enhanceMapPage=()=>{const site=document.querySelector('.site'),dock=document.querySelector('.mobile-dock');if(!site||!dock)return false;let page=document.querySelector('.map-page');if(!page){page=document.createElement('section');page.id='map';page.className='screen map-page';page.innerHTML='<div class="map-toolbar"><span></span><strong>旅行地图</strong><span></span></div><div class="map-title"><small>TRAVEL MAP</small><h2>足迹地图</h2></div><div class="travel-map-canvas"></div>';site.insertBefore(page,dock)}let button=dock.querySelector('.map-dock-button');if(!button){button=document.createElement('button');button.className='map-dock-button';button.innerHTML='<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z"></path><circle cx="12" cy="10" r="2.2"></circle></svg><span>地图</span>';button.addEventListener('click',()=>{document.querySelectorAll('.screen.mobile-active').forEach(screen=>screen.classList.remove('mobile-active'));dock.querySelectorAll('button').forEach(item=>item.classList.remove('active'));page.classList.add('mobile-active');button.classList.add('active');renderTravelMap()});dock.appendChild(button);dock.querySelectorAll('button:not(.map-dock-button)').forEach(item=>item.addEventListener('click',()=>{page.classList.remove('mobile-active');button.classList.remove('active')},{capture:true}))}return true};
        const enhanceTravelRouteMap=()=>{const page=document.querySelector('.travel-detail-page.mobile-active');const timeline=page?.querySelector('.travel-timeline');const days=timeline?[...timeline.querySelectorAll(':scope > .travel-day')]:[];if(!timeline||!days.length)return false;const projectName=page.querySelector('.travel-name-button')?.textContent.trim()||page.querySelector('.travel-detail-toolbar input')?.value.trim()||'旅行';let projects=[];try{projects=JSON.parse(localStorage.getItem('zhijian-travel-projects')||'[]')}catch{}const project=projects.find(item=>item.name===projectName);const projectId=project?.id||projectName;const dates=days.map(day=>day.querySelector('.travel-date b')?.textContent.trim()||'');const signature=`${projectId}:${dates.join('|')}`;if(timeline.dataset.routeSignature===signature)return false;timeline.querySelectorAll('.route-stop-card,.travel-route-line,.route-map-note').forEach(node=>node.remove());timeline.dataset.routeSignature=signature;timeline.classList.add('travel-route-map');let locations={};try{locations=JSON.parse(localStorage.getItem('zhijian-travel-locations-v1')||'{}')}catch{}const note=document.createElement('p');note.className='route-map-note';note.textContent='按时间抵达 · 点击目的地查看当日穿搭';timeline.prepend(note);const height=Math.max(120,days.length*145);const points=days.map((_,index)=>({x:index%2===0?72:248,y:55+index*145}));let path='';points.forEach((point,index)=>{if(index===0)path=`M ${point.x} ${point.y}`;else{const previous=points[index-1],middle=(previous.y+point.y)/2;path+=` C ${previous.x} ${middle}, ${point.x} ${middle}, ${point.x} ${point.y}`}});const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('travel-route-line');svg.setAttribute('viewBox',`0 0 320 ${height}`);svg.setAttribute('preserveAspectRatio','none');svg.innerHTML=`<path d="${path}"></path>${points.map(point=>`<circle cx="${point.x}" cy="${point.y}" r="5"></circle>`).join('')}`;timeline.prepend(svg);days.forEach((day,index)=>{const date=dates[index],dayButton=day.querySelector('.travel-day-look');const card=document.createElement('div');card.className='route-stop-card';const dayLabel=document.createElement('small');dayLabel.textContent=`DAY ${String(index+1).padStart(2,'0')} · ${date}`;const actions=document.createElement('div');actions.className='route-stop-actions';const place=document.createElement('button');place.type='button';place.className='route-place-button';place.textContent=locations[projectId]?.[date]||`目的地 ${String(index+1).padStart(2,'0')}`;place.addEventListener('click',()=>dayButton?.click());const edit=document.createElement('button');edit.type='button';edit.className='route-place-edit';edit.textContent='✎';edit.setAttribute('aria-label',`编辑${date}目的地`);edit.addEventListener('click',()=>{const value=prompt(`填写 ${date} 到达的地点`,place.textContent)?.trim();if(!value)return;let saved={};try{saved=JSON.parse(localStorage.getItem('zhijian-travel-locations-v1')||'{}')}catch{}saved[projectId]={...(saved[projectId]||{}),[date]:value};localStorage.setItem('zhijian-travel-locations-v1',JSON.stringify(saved));place.textContent=value});actions.append(place,edit);card.append(dayLabel,actions);day.appendChild(card)});return true};
        const returnAfterOutfitSave=()=>{const save=document.querySelector('.styling-toolbar button[aria-label="保存穿搭"]');if(!save||save.dataset.returnAfterSave==='true')return false;save.dataset.returnAfterSave='true';save.addEventListener('click',()=>window.setTimeout(()=>document.querySelector('.mobile-dock button:nth-child(2)')?.click(),80));return true};
        const outfitSlotOrder={外套:0,上衣:1,下装:2,配饰:3,鞋履:4};
        const garmentSlotForImage=image=>{const alt=image.getAttribute('alt')||'';if(alt in outfitSlotOrder)return alt;let items=[];try{items=JSON.parse(localStorage.getItem('zhijian-wardrobe-v1')||'[]')}catch{}const source=image.getAttribute('src')||image.src;const item=items.find(item=>item.image===source||item.image===image.src);return item?.category==='上装'?'上衣':item?.category};
        const sortOutfitNodes=(container,nodes,getSlot,layout='flow')=>{const original=[...nodes],sorted=original.map((node,index)=>({node,index,rank:outfitSlotOrder[getSlot(node)]??99})).sort((a,b)=>a.rank-b.rank||a.index-b.index).map(entry=>entry.node);if(sorted.every((node,index)=>node===original[index]))return false;sorted.forEach(node=>container.appendChild(node));if(layout==='panels')sorted.forEach((node,index)=>{node.style.left=`${index*100/sorted.length}%`;node.style.width=`${100/sorted.length}%`;node.classList.remove('panel-only','panel-first','panel-middle','panel-last');node.classList.add(`panel-${sorted.length===1?'only':index===0?'first':index===sorted.length-1?'last':'middle'}`)});if(layout==='previews')sorted.forEach((node,index)=>{node.style.left=`${index*100/sorted.length}%`;node.style.width=`${100/sorted.length}%`;for(const prefix of ['saved-preview-image','sheet-preview-image'])if(node.classList.contains(prefix)){node.classList.remove('preview-only','preview-first','preview-middle','preview-last');node.classList.add(`preview-${sorted.length===1?'only':index===0?'first':index===sorted.length-1?'last':'middle'}`)}});return true};
        const syncOutfitImageOrder=()=>{document.querySelectorAll('.look-triptych').forEach(container=>sortOutfitNodes(container,container.querySelectorAll('.animated-panel'),node=>node.querySelector('b')?.textContent,'panels'));document.querySelectorAll('.saved-entry-preview,.sheet-look-images,.travel-look-preview').forEach(container=>sortOutfitNodes(container,container.querySelectorAll(':scope > img'),garmentSlotForImage,container.matches('.saved-entry-preview,.sheet-look-images')?'previews':'flow'));document.querySelectorAll('.travel-outfit-gallery').forEach(container=>sortOutfitNodes(container,container.querySelectorAll(':scope > article'),node=>node.querySelector('span')?.textContent));document.querySelectorAll('.picker-panel').forEach(container=>sortOutfitNodes(container,container.querySelectorAll(':scope > .picker-group'),node=>node.querySelector('.picker-title h3')?.textContent));document.querySelectorAll('.look-caption').forEach(container=>sortOutfitNodes(container,container.querySelectorAll(':scope > span'),node=>{let items=[];try{items=JSON.parse(localStorage.getItem('zhijian-wardrobe-v1')||'[]')}catch{}const item=items.find(item=>item.name===node.textContent);return item?.category==='上装'?'上衣':item?.category}))};
        const stabilizeGarmentForm=()=>{const modal=document.querySelector('.add-modal');if(!modal||modal.dataset.nameCommitGuard==='true')return false;modal.dataset.nameCommitGuard='true';const commitName=()=>{const name=modal.querySelector('input[name="name"]');if(!name)return;if(document.activeElement===name)name.blur();name.dispatchEvent(new Event('input',{bubbles:true}));name.dispatchEvent(new Event('change',{bubbles:true}))};modal.querySelectorAll('select').forEach(select=>select.addEventListener('pointerdown',commitName,{capture:true}));modal.querySelector('.submit')?.addEventListener('pointerdown',commitName,{capture:true});return true};
        const enhanceGarmentEditor=()=>{const modal=[...document.querySelectorAll('.add-modal')].find(node=>node.querySelector('.modal-title h2')?.textContent.trim()==='编辑衣服');if(!modal)return false;const upload=modal.querySelector('label.upload');const input=upload?.querySelector('input[type="file"]');const image=upload?.querySelector('img');if(!upload||!input||!image||upload.querySelector('.adjust-garment-image'))return false;upload.classList.add('edit-current-image');const adjust=document.createElement('button');adjust.type='button';adjust.className='adjust-garment-image';adjust.textContent='点击图片调整';adjust.addEventListener('click',async event=>{event.preventDefault();event.stopPropagation();try{const blob=await fetch(image.src).then(response=>response.blob());const file=new File([blob],'current-garment.jpg',{type:blob.type||'image/jpeg'});const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}))}catch{input.click()}});upload.appendChild(adjust);if(!upload.nextElementSibling?.classList.contains('replace-garment-image')){const replace=document.createElement('button');replace.type='button';replace.className='replace-garment-image';replace.textContent='重新上传新图片';replace.addEventListener('click',()=>input.click());upload.after(replace)}return true};
        const enableCropGestures=()=>{const frame=document.querySelector('.crop-frame');if(!frame||frame.dataset.gestures==='on')return;const ranges=[...frame.closest('.crop-modal').querySelectorAll('input[type="range"]')];if(ranges.length<3)return;const [zoomInput,xInput,yInput]=ranges;frame.dataset.gestures='on';const tip=document.createElement('p');tip.className='crop-gesture-tip';tip.textContent='单指拖动位置 · 双指捏合缩放';frame.after(tip);let state=null;const distance=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);const center=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});frame.addEventListener('touchstart',e=>{if(e.touches.length===1)state={kind:'drag',x:e.touches[0].clientX,y:e.touches[0].clientY,baseX:Number(xInput.value),baseY:Number(yInput.value)};else if(e.touches.length>=2)state={kind:'pinch',distance:distance(e.touches),center:center(e.touches),zoom:Number(zoomInput.value),baseX:Number(xInput.value),baseY:Number(yInput.value)}},{passive:true});frame.addEventListener('touchmove',e=>{if(!state)return;e.preventDefault();if(state.kind==='drag'&&e.touches.length===1){setReactRange(xInput,state.baseX+e.touches[0].clientX-state.x);setReactRange(yInput,state.baseY+e.touches[0].clientY-state.y)}else if(state.kind==='pinch'&&e.touches.length>=2){const point=center(e.touches);setReactRange(zoomInput,state.zoom*distance(e.touches)/state.distance);setReactRange(xInput,state.baseX+point.x-state.center.x);setReactRange(yInput,state.baseY+point.y-state.center.y)}},{passive:false});frame.addEventListener('touchend',e=>{if(e.touches.length===0)state=null},{passive:true})};
        const observer = new MutationObserver(() => {replaceHomeImage();renderSettings();enhanceMapPage();enhanceTravelDestinations();returnAfterOutfitSave();syncOutfitImageOrder();stabilizeGarmentForm();enhanceGarmentEditor();enableCropGestures();window.zhijianShowUpdate?.()});observer.observe(document.getElementById('root'), { childList:true, subtree:true });replaceHomeImage();renderSettings();enhanceMapPage();enhanceTravelDestinations();returnAfterOutfitSave();syncOutfitImageOrder();stabilizeGarmentForm();enhanceGarmentEditor();enableCropGestures();window.zhijianShowUpdate?.();
      })();
